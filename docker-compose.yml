services:
  stress-server:
    build:
      context: .
    image: wesad-stress-server:latest
    container_name: wesad-stress-server
    restart: unless-stopped
    ports:
      - "9099:9099"
    volumes:
      - ./results:/app/results
    command:
      - python
      - -m
      - serving.server
      - --host
      - 0.0.0.0
      - --port
      - "9099"
      - --norm-mode
      - running
      - --threads
      - "1"
      - --xai-method
      - ${WESAD_XAI_METHOD:-none}
      - --xai-threshold
      - ${WESAD_XAI_THRESHOLD:-0}